[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yu"
version = "0.0.8.1"
description = "Yu — a local-first long-term personal decision assistant for Windows PC."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"