[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yu"
version = "0.0.9"
description = "Yu — a local-first long-term personal decision assistant for Windows PC."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=15,<16"]
wake = ["sounddevice>=0.5.6,<0.6", "websockets>=15,<16"]
media = ["winrt-Windows.Media.Control>=3.2,<4; sys_platform == 'win32'", "winrt-Windows.Foundation>=3.2,<4; sys_platform == 'win32'", "winrt-Windows.Foundation.Collections>=3.2,<4; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"yu.voice.wake" = ["*.ps1", "*.cs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
